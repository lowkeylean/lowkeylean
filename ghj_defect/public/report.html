<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Defect</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="app-header">
    <a class="back" href="/">←</a>
    <h1>Report Defect</h1>
  </header>
  <main>
    <div id="msg" class="msg"></div>

    <section id="auth-card" class="card">
      <label for="access-code">Authorization Code</label>
      <input type="password" id="access-code" placeholder="Enter your code" autocomplete="off" />
      <button id="auth-btn">Verify Access</button>
    </section>

    <section id="form-card" class="card" hidden>
      <form id="report-form">
        <label for="segment">Location Segment</label>
        <select id="segment" required>
          <option value="" disabled selected>Select affected area</option>
        </select>

        <div class="file-input">
          <label for="before">Before Photo</label>
          <input type="file" id="before" accept="image/*" capture="environment" required />
          <img id="before-preview" class="preview" alt="Before photo preview" />
        </div>

        <button type="submit" id="submit-btn">Report Defect</button>
      </form>
    </section>
  </main>
  <script src="/js/sw-register.js"></script>
  <script type="module" src="/js/report.js"></script>
</body>
</html>
