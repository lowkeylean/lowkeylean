<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Report — Grand Hyatt Defects</title>
  <meta name="theme-color" content="#06070d" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=9" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a href="/" class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </span>
      Grand Hyatt <em>Defects</em>
    </a>
    <nav class="tabs">
      <a href="/report.html" class="active">Report</a>
      <a href="/worker.html">Queue</a>
      <a href="/projects.html">Projects</a>
      <a href="/minutes.html">Minutes</a>
      <a href="/dashboard.html">Analytics</a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <h1>Report defects</h1>
      <p>Log issues with locations, details, and photos. Submit multiple defects at once.</p>
    </div>

    <div id="msg" class="msg" role="status"></div>

    <section id="auth-card" class="panel">
      <h2>Authorization required</h2>
      <label class="field-label" for="access-code">Access code</label>
      <input type="password" id="access-code" placeholder="Enter your access code" autocomplete="off" />
      <button id="auth-btn" class="btn"><span class="spinner"></span>Unlock reporting</button>
    </section>

    <section id="form-card" class="panel" hidden>
      <form id="report-form">
        <!-- Area Selection (only visible for first defect) -->
        <div id="area-section">
          <label class="field-label">Area</label>
          <div class="button-group" id="area-group">
            <button type="button" class="btn-select" data-value="Rooms">Rooms</button>
            <button type="button" class="btn-select" data-value="Public Area">Public Area</button>
            <button type="button" class="btn-select" data-value="Restaurant">Restaurant</button>
          </div>

          <!-- Room No. / Name (conditional, searchable) -->
          <div id="room-name-section" hidden>
            <label class="field-label" id="room-name-label">Room No.</label>
            <div class="combo">
              <input type="text" id="room-name" autocomplete="off" placeholder="Type to search…" />
              <div class="combo-options" id="room-options" hidden></div>
            </div>
          </div>

          <!-- Reported By -->
          <label class="field-label" for="reported-by">Reported by</label>
          <input type="text" id="reported-by" placeholder="Your name" required />

          <!-- Department -->
          <label class="field-label" for="department">Department</label>
          <select id="department" required>
            <option value="" disabled selected>Select department</option>
            <option value="Managerial">Managerial</option>
            <option value="Engineering">Engineering</option>
            <option value="F&B">F&B</option>
            <option value="Rooms">Rooms</option>
            <option value="Housekeeping">Housekeeping</option>
            <option value="Others">Others</option>
          </select>
        </div>

        <!-- Defect Title -->
        <label class="field-label" for="title">Defect title</label>
        <input type="text" id="title" placeholder="e.g., Cracked tile, Broken door handle" />

        <!-- Defect Type -->
        <label class="field-label">Defect type</label>
        <div class="button-group" id="type-group">
          <button type="button" class="btn-select" data-value="Civil">Civil</button>
          <button type="button" class="btn-select" data-value="Machinery">Machinery</button>
          <button type="button" class="btn-select" data-value="Other">Other</button>
        </div>

        <!-- Priority -->
        <label class="field-label">Priority</label>
        <div class="button-group" id="priority-group">
          <button type="button" class="btn-select" data-value="Low">Low</button>
          <button type="button" class="btn-select" data-value="Medium">Medium</button>
          <button type="button" class="btn-select" data-value="High">High</button>
          <button type="button" class="btn-select" data-value="Critical">Critical</button>
        </div>

        <!-- Photo Upload -->
        <label class="field-label">Photo</label>
        <div class="photo-upload-container">
          <label class="photo-btn photo-capture">
            <input type="file" id="capture-photo" accept="image/*" capture="environment" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <span>Take photo</span>
          </label>
          <label class="photo-btn photo-gallery">
            <input type="file" id="gallery-photo" accept="image/*" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><rect x="7" y="7" width="4" height="4"/><path d="M7 11l4-4 5 5 4-4"/></svg>
            <span>Gallery</span>
          </label>
        </div>
        <div id="photo-preview-container"></div>

        <!-- Add Defect Button -->
        <button type="button" id="add-defect-btn" class="btn btn-secondary">+ Add defect</button>

        <!-- Accumulated Defects List -->
        <div id="defects-list-container" class="defects-list-container" hidden>
          <label class="field-label">Defects to submit</label>
          <div id="defects-list"></div>
        </div>

        <!-- Submit Button (only visible when defects exist) -->
        <button type="submit" id="submit-btn" class="btn" hidden><span class="spinner"></span>Submit all defects</button>
      </form>
    </section>
  </main>

  <script src="/js/sw-register.js"></script>
  <script type="module" src="/js/report.js?v=9"></script>
</body>
</html>
