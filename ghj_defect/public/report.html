<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Report — GHJ Defects</title>
  <meta name="theme-color" content="#0a0b10" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a href="/" class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </span>
      GHJ <em>Defects</em>
    </a>
    <nav class="tabs">
      <a href="/report.html" class="active">Report</a>
      <a href="/worker.html">Queue</a>
      <a href="/dashboard.html">Analytics</a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <h1>Report a defect</h1>
      <p>Select the affected segment and attach one before photo.</p>
    </div>

    <div id="msg" class="msg" role="status"></div>

    <section id="auth-card" class="panel">
      <h2>Authorization required</h2>
      <label class="field-label" for="access-code">Access code</label>
      <input type="password" id="access-code" placeholder="Enter your access code" autocomplete="off" />
      <button id="auth-btn" class="btn"><span class="spinner"></span>Unlock reporting</button>
    </section>

    <section id="form-card" class="panel" hidden>
      <form id="report-form">
        <label class="field-label" for="segment">Segment</label>
        <select id="segment" required>
          <option value="" disabled selected>Select affected area</option>
        </select>

        <label class="field-label" for="before">Before photo</label>
        <label class="dropzone" id="before-zone">
          <input type="file" id="before" accept="image/*" capture="environment" required />
          <span class="dz-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </span>
          <span class="dz-title">Tap to capture photo</span>
          <span class="dz-hint">One photo required · compressed automatically</span>
          <img id="before-preview" class="preview" alt="Before photo preview" />
        </label>

        <button type="submit" id="submit-btn" class="btn"><span class="spinner"></span>Submit defect</button>
      </form>
    </section>
  </main>

  <script src="/js/sw-register.js"></script>
  <script type="module" src="/js/report.js"></script>
</body>
</html>
