<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a href="/" class="brand">

        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>

      <a href="/worker.html" class="active">Queue</a>

  <main>
    <div class="page-head">
      <h1>Work queue</h1>
      <p>Open a task to start it. Attach an after photo and remarks to close it.</p>

    <div id="msg" class="msg" role="status"></div>

    <!-- Worker Name Input -->
    <section class="panel">
      <label class="field-label" for="worker-name">Your name</label>
      <input type="text" id="worker-name" placeholder="Enter your name" autocomplete="off" />
    </section>

    <!-- Categorized Queue by Area -->
    <div id="list" class="queue-by-area"></div>

  <script src="/js/sw-register.js"></script>
